name: GitHub Pages CI/CD

on:
  push:
    branches:
      - main       # Production
      - develop    # Staging

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p public
          # Copy everything into the public folder
          cp -r * public/ || true

      # Upload public folder for GitHub Pages deployment
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "Staging site is live at: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "Production site is live at: ${{ steps.deployment.outputs.page_url }}"
          fi

