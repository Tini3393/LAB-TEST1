name: CI/CD Pipeline for GitHub Pages

# Trigger on pushes to main (production) or develop (staging)
on:
  push:
    branches:
      - main       # Production
      - develop    # Staging

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ./public
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare public folder
        run: |
          mkdir -p public
          # Copy all site files to public folder
          cp -r * public/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}"

